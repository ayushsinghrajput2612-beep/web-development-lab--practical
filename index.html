<!DOCTYPE html>
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses</p>

        <h3>Add New Expense</h3>

        <label>Expense Name</label>
        <input type="text" id="name" placeholder="Enter expense name">

        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <label>Category</label>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
        </select>

        <button onclick="addExpense()">Add Expense</button>

        <div class="total-box">
            <h3>Total Expenses</h3>
            <h2>₹<span id="total">0</span></h2>
        </div>

        <h3>Filter Expenses</h3>

        <select id="filter" onchange="showExpenses()">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
        </select>

        <h3>Expense List</h3>

        <ul id="list"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
